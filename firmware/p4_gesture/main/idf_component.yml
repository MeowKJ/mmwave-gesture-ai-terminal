## IDF Component Manager Manifest File
dependencies:
  espressif/cjson:
    version: "1.7.19~2"
  # Adding a dependency must not silently upgrade the validated USB transport.
  espressif/tinyusb:
    version: "0.21.0~4"
  espressif/usb:
    version: "1.6.0"
  ## Required IDF version
  idf:
    version: ">=4.1.0"
  espressif/esp-serial-flasher:
    version: "2.0.0"
  espressif/esp_lvgl_port:
    version: 2.7.*
    public: true
  lvgl/lvgl:
    version: 9.4.*
    public: true
  espressif/esp_lcd_co5300:
    version: 2.0.*
    public: true
  espressif/esp_tinyusb:
    version: "^2.0.1~1"
    public: true
  # Only resolved when MEOAVE_USE_ESP_SR=1.  Keeping this opt-in preserves
  # the validated offline build while the custom 猫猫 WakeNet asset is being
  # prepared.
  espressif/esp-sr:
    version: "2.6.2"
    rules:
      - if: "$MEOAVE_USE_ESP_SR == 1"
